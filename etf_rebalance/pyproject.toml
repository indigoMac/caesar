[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-rebalance"
version = "0.1.0"
description = "Point-in-time research framework for Russell index reconstitution event studies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "exchange-calendars>=4.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
rebalance-study = "rebalance.research.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
